(function(){
  let seq=0; const pending={};
  window.__ipjokerResolve=function(id,result){
    const p=pending[id]; if(!p)return; delete pending[id];
    try{p(JSON.parse(result));}catch(e){p({ok:false,message:String(result)});}
  };
  function call(action,args,wait){
    const id=String(++seq);
    if(!window.IPJokerNative||!window.IPJokerNative.postMessage)
      return Promise.resolve({ok:false,message:"ارتباط با سرویس اندروید برقرار نیست"});
    return new Promise(resolve=>{
      pending[id]=resolve;
      window.IPJokerNative.postMessage(JSON.stringify({id,action,args:args||{}}));
      if(wait!==false)setTimeout(()=>{if(pending[id]){delete pending[id];resolve({ok:false,message:"پاسخی از سرویس دریافت نشد"});}},45000);
      else resolve({ok:true});
    });
  }
  window.IPJokerVPN={
    connect:(host,port,type)=>call("connect",{host,port,type}),
    disconnect:()=>call("disconnect",{}),
    getStatus:()=>call("status",{}),
    saveProfile:(host,port,type)=>call("save",{host,port,type},false),
    saveCurrentProfile:(host,port,type)=>call("save",{host,port,type},false),
    getSavedProfiles:()=>"[]"
  };
})();

async function getTxt(us){

      }).catch(e=>{dlE(e);L("DL","✗ "+host(u)+" "+(e.name=="AbortError"?"timeout":e.message||e))}).finally(()=>{

}
